<!--
  Komponen Multi-Rekening SAVEURMONEY
  Standar Baku: TABUNGAN_OPERASIONAL & TABUNGAN_UTAMA
  Anti-Slop: Tidak ada kata 'Saya', tidak ada badge mengambang palsu
-->
<div class="space-y-3.5">
  <!-- Baris Kontrol & Tab Filter Rekening -->
  <div class="flex flex-col gap-2.5 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex items-center gap-2">
      <h3 class="text-xs font-bold uppercase tracking-wider text-white bg-white/10 backdrop-blur-xs px-2.5 py-1 rounded-md border border-white/15 dark:text-white">
        Daftar Rekening
      </h3>
      <span class="rounded bg-surface-subtle dark:bg-surface-dark-subtle px-1.5 py-0.2 text-[10px] font-bold text-gray-600 dark:text-gray-300" x-text="akunTerfilter.length"></span>
    </div>

    <div class="flex items-center gap-2">
      <!-- Segmented Button Filter Ringkas -->
      <div class="inline-flex rounded-lg bg-surface-subtle p-0.5 text-xs font-semibold dark:bg-surface-dark-subtle border border-border/60 dark:border-border-dark">
        <button
          type="button"
          @click="tabKategoriAkun = 'SEMUA'"
          class="rounded-md px-2 py-1 transition-all"
          :class="tabKategoriAkun === 'SEMUA' ? 'bg-surface text-tema-dasar shadow-2xs dark:bg-surface-dark dark:text-white font-bold' : 'text-gray-500 hover:text-tema-dasar dark:text-gray-400'"
        >
          Semua
        </button>
        <button
          type="button"
          @click="tabKategoriAkun = 'OPERASIONAL'"
          class="rounded-md px-2 py-1 transition-all"
          :class="tabKategoriAkun === 'OPERASIONAL' ? 'bg-surface text-tema-dasar shadow-2xs dark:bg-surface-dark dark:text-white font-bold' : 'text-gray-500 hover:text-tema-dasar dark:text-gray-400'"
        >
          Operasional
        </button>
        <button
          type="button"
          @click="tabKategoriAkun = 'TABUNGAN'"
          class="rounded-md px-2 py-1 transition-all"
          :class="tabKategoriAkun === 'TABUNGAN' ? 'bg-surface text-tema-dasar shadow-2xs dark:bg-surface-dark dark:text-white font-bold' : 'text-gray-500 hover:text-tema-dasar dark:text-gray-400'"
        >
          Utama
        </button>
      </div>

      <!-- Tombol Buka Tab Tambah Akun Inline -->
      <button
        type="button"
        @click="bukaTabAksi('tambahAkun')"
        class="inline-flex items-center gap-1.5 rounded-lg border border-border bg-surface px-2.5 py-1 text-xs font-semibold text-gray-700 hover:bg-surface-subtle dark:border-border-dark dark:bg-surface-dark dark:text-gray-300 transition-colors"
      >
        <svg class="w-3.5 h-3.5 text-tema-toska" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4"></path>
        </svg>
        <span>Tambah</span>
      </button>
    </div>
  </div>

  <!-- State Kosong jika Belum Ada Rekening -->
  <template x-if="akunTerfilter.length === 0">
    <div class="rounded-xl border border-dashed border-border p-6 text-center dark:border-border-dark">
      <div class="mx-auto flex w-10 h-10 items-center justify-center rounded-lg bg-surface-subtle text-gray-400 dark:bg-surface-dark-subtle">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="2" y="5" width="20" height="14" rx="2" stroke-width="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
      </div>
      <p class="mt-2 text-xs font-bold text-tema-dasar dark:text-white">Belum Ada Rekening Terdaftar</p>
      <p class="mt-0.5 text-[11px] text-gray-500 dark:text-gray-400">Tambahkan Tabungan Operasional atau Tabungan Utama</p>
      <button
        type="button"
        @click="bukaTabAksi('tambahAkun')"
        class="mt-3 inline-flex items-center gap-1.5 rounded-lg bg-tema-toska px-3 py-1.5 text-xs font-bold text-white shadow-xs hover:bg-tema-toska-hover"
      >
        <span>Tambah Rekening Pertama</span>
      </button>
    </div>
  </template>

  <!-- Grid Kartu Rekening -->
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2" x-show="akunTerfilter.length > 0">
    <template x-for="akun in akunTerfilter" :key="akun.id">
      <div
        class="group relative flex flex-col justify-between rounded-xl border border-border bg-surface p-4 transition-all hover:border-tema-toska/40 hover:shadow-xs dark:border-border-dark dark:bg-surface-dark"
      >
        <div>
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <div
                class="flex w-9 h-9 shrink-0 items-center justify-center rounded-lg"
                :class="akun.tipe === 'TABUNGAN_UTAMA'
                  ? 'bg-tema-terakota/15 text-tema-terakota'
                  : 'bg-tema-toska/15 text-tema-toska'"
              >
                <template x-if="akun.tipe === 'TABUNGAN_UTAMA'">
                  <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                </template>
                <template x-if="akun.tipe !== 'TABUNGAN_UTAMA'">
                  <svg class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"></rect>
                    <line x1="2" y1="10" x2="22" y2="10"></line>
                  </svg>
                </template>
              </div>

              <div>
                <h4 class="text-xs font-bold text-tema-dasar dark:text-white" x-text="akun.nama"></h4>
                <p class="text-[11px] text-gray-400" x-text="akun.kategori"></p>
              </div>
            </div>

            <!-- Label Tipe Fungsional, Tombol Edit & Hapus -->
            <div class="flex items-center gap-1.5">
              <span
                class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded"
                :class="akun.tipe === 'TABUNGAN_UTAMA'
                  ? 'bg-tema-terakota/15 text-tema-terakota'
                  : 'bg-tema-toska/15 text-tema-toska'"
                x-text="akun.tipe === 'TABUNGAN_UTAMA' ? 'Tabungan Utama' : 'Operasional'"
              ></span>

              <button
                type="button"
                @click="mulaiEditRekening(akun.id)"
                class="rounded p-1 text-gray-400 hover:text-tema-toska dark:hover:text-tema-kabut transition-colors"
                title="Edit Rekening"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                </svg>
              </button>

              <button
                type="button"
                @click="hapusRekening(akun.id)"
                class="rounded p-1 text-gray-300 hover:text-rose-500 dark:hover:text-rose-400 transition-colors"
                title="Hapus Rekening"
              >
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
              </button>
            </div>
          </div>

          <!-- Nominal Saldo -->
          <div class="mt-3.5">
            <span class="text-[11px] font-medium text-gray-400">Saldo Tersedia</span>
            <div
              class="text-lg font-bold tracking-tight tabular-nums"
              :class="akun.tipe === 'TABUNGAN_OPERASIONAL' && akun.saldo < batasAmanOperasional
                ? 'text-rose-600 dark:text-rose-400'
                : 'text-tema-dasar dark:text-white'"
              x-text="formatRupiah(akun.saldo)"
            ></div>
            <!-- Keterangan Natural jika di bawah ambang batas proteksi -->
            <template x-if="akun.tipe === 'TABUNGAN_OPERASIONAL' && akun.saldo < batasAmanOperasional">
              <p class="mt-0.5 text-[10px] font-medium text-rose-600 dark:text-rose-400" x-text="'Di bawah batas aman cadangan (' + formatRupiah(batasAmanOperasional) + ')'">
              </p>
            </template>
          </div>
        </div>

        <!-- Footer Nomor Rekening -->
        <div class="mt-3.5 flex items-center justify-between border-t border-border/60 pt-2 text-xs text-gray-400 dark:border-border-dark">
          <div class="flex items-center gap-1.5 font-mono text-[11px]">
            <span>No:</span>
            <span x-text="formatNomorRekening(akun.nomorRekening, akun.tampilNomor)"></span>
          </div>

          <template x-if="akun.nomorRekening">
            <button
              type="button"
              @click="toggleIntipRekening(akun.id)"
              class="text-[10px] font-semibold text-tema-toska hover:text-tema-toska-hover"
              x-text="akun.tampilNomor ? 'Tutup' : 'Intip'"
            ></button>
          </template>
        </div>
      </div>
    </template>
  </div>
</div>
